<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Taxi Checker Pattern Top Banner -->
  <g fill="#f59e0b" opacity="0.9">
    <rect x="96" y="70" width="40" height="24" rx="4"/>
    <rect x="176" y="70" width="40" height="24" rx="4"/>
    <rect x="256" y="70" width="40" height="24" rx="4"/>
    <rect x="336" y="70" width="40" height="24" rx="4"/>
    <rect x="136" y="94" width="40" height="24" rx="4"/>
    <rect x="216" y="94" width="40" height="24" rx="4"/>
    <rect x="296" y="94" width="40" height="24" rx="4"/>
    <rect x="376" y="94" width="40" height="24" rx="4"/>
  </g>

  <!-- Central Taximeter Display Card -->
  <rect x="76" y="140" width="360" height="240" rx="28" fill="#020617" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Digital Text "$50.00" -->
  <text x="256" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#22c55e" letter-spacing="2">
    $50.00
  </text>

  <!-- Subtitle Pachuca -->
  <text x="256" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#38bdf8" letter-spacing="4">
    PACHUCA • AUDITABLE
  </text>
  
  <text x="256" y="335" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#94a3b8">
    TARIFA JUSTA Y TRANSPARENTE
  </text>

  <!-- Bottom Taxi Icon & GPS Pin -->
  <g transform="translate(196, 400)">
    <!-- Taxi Icon -->
    <path d="M15 8l10-18h70l10 18H15z" fill="#f59e0b"/>
    <rect x="5" y="8" width="110" height="42" rx="10" fill="url(#amber-grad)"/>
    <!-- Wheels -->
    <circle cx="28" cy="50" r="14" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="92" cy="50" r="14" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="28" cy="50" r="5" fill="#f8fafc"/>
    <circle cx="92" cy="50" r="5" fill="#f8fafc"/>
    <!-- Windshield -->
    <path d="M22 6l7-12h28v12H22z" fill="#0284c7"/>
    <path d="M63 6h28l-7-12H63v12z" fill="#0284c7"/>
    <!-- Headlights -->
    <circle cx="12" cy="24" r="5" fill="#fef08a"/>
    <circle cx="108" cy="24" r="5" fill="#ef4444"/>
  </g>
</svg>
